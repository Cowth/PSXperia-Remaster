name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build solution
        run: dotnet build .\PSXperia.Remastered.sln -c Release -p:Platform=x64
      - name: Run runtime archive measurement tests
        run: dotnet run --project .\tests\PSXperia.RuntimeArchiveMeasure.Tests\PSXperia.RuntimeArchiveMeasure.Tests.csproj -c Release --no-build
      - name: Run Engine tests
        run: dotnet test .\tests\PSXperia.Engine.Tests\PSXperia.Engine.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
      - name: Run WPF application tests
        run: dotnet test .\tests\PSXperia.App.Tests\PSXperia.App.Tests.csproj -c Release -p:Platform=x64 --no-build --logger "console;verbosity=normal"
